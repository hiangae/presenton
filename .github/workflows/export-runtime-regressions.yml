name: Export runtime regressions

on:
  push:
    branches: [main, fix/security-and-vulnerabilities]
    paths:
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/export-runtime-regressions.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/export-runtime-regressions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Repository tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
